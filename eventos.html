<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Eventos | Marvin Cua Ministerios</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-color: #ffffff;
            --brand-red: #ff2222;
            --muted-color: #999999;
            --border-color: #262626;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Banner */
        .top-banner {
            background-color: #000000;
            color: var(--muted-color);
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            width: 100%;
        }

        /* Header Principal */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(11, 11, 11, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--accent-color);
        }

        .logo-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brand-red);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav ul li a {
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: var(--transition);
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-color);
        }

        /* Sección de Eventos */
        .events-section {
            padding: 80px 50px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .section-title {
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            border-left: 4px solid var(--brand-red);
            padding-left: 15px;
            color: #ffffff;
        }

        .events-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            gap: 20px;
        }

        .event-card:hover {
            border-color: var(--brand-red);
            transform: translateY(-3px);
        }

        .event-date-box {
            background-color: #0b0b0b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            min-width: 100px;
        }

        .event-day {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            color: var(--brand-red);
            line-height: 1;
        }

        .event-month {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted-color);
            font-weight: 700;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .event-location {
            color: var(--muted-color);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-event {
            background-color: var(--brand-red);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-event:hover {
            background-color: #e01b1b;
        }

        .loading-text, .empty-text {
            text-align: center;
            color: var(--muted-color);
            font-size: 1.1rem;
            padding: 40px 0;
        }

        /* Footer */
        footer {
            background-color: #050505;
            border-top: 1px solid var(--border-color);
            padding: 50px 20px 30px;
            text-align: center;
            width: 100%;
        }

        .copyright {
            color: var(--muted-color);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { display: none; }
            .events-section { padding: 40px 20px; }
            .event-card { flex-direction: column; align-items: flex-start; }
            .btn-event { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="top-banner">
        Próximos Eventos y Ministraciones
    </div>

    <header>
        <a href="index.html" class="logo-area">
            <div class="logo-text">Marvin Cua</div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="biografia.html">Biografía</a></li>
                <li><a href="eventos.html" class="active">Eventos</a></li>
                <li><a href="recursos.html">Recursos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="events-section">
        <h2 class="section-title">Próximos Eventos</h2>
        <div class="events-grid" id="dynamic-events-container">
            <div class="loading-text">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando eventos...
            </div>
        </div>
    </section>

    <footer id="contacto">
        <div class="copyright">
            &copy; 2026 Marvin Cua Ministerios. Todos los derechos reservados.
        </div>
    </footer>

    <!-- Carga desde Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAW9ADzuAaMcP-WIeDVtlOpw_L7etW5B1w",
            authDomain: "marvin-cua.firebaseapp.com",
            projectId: "marvin-cua",
            storageBucket: "marvin-cua.firebasestorage.app",
            messagingSenderId: "956482956723",
            appId: "1:956482956723:web:24fe46155ba28bbd1a6fc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarEventos() {
            const container = document.getElementById('dynamic-events-container');
            
            try {
                const q = query(collection(db, "eventos"), orderBy("fecha", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="empty-text">No hay eventos programados por el momento. ¡Consulta más adelante!</div>';
                    return;
                }

                let htmlContent = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Formatear fecha (Ej: 2026-10-15 -> Día: 15, Mes: OCT)
                    const fechaObj = new Date(data.fecha + 'T00:00:00');
                    const dia = !isNaN(fechaObj.getDate()) ? fechaObj.getDate() : '--';
                    const mes = !isNaN(fechaObj.getMonth()) ? fechaObj.toLocaleString('es', { month: 'short' }).toUpperCase() : 'PRÓX';
                    
                    htmlContent += `
                        <div class="event-card">
                            <div class="event-date-box">
                                <div class="event-day">${dia}</div>
                                <div class="event-month">${mes}</div>
                            </div>
                            <div class="event-info">
                                <h3 class="event-title">${data.titulo}</h3>
                                <div class="event-location">
                                    <i class="fa-solid fa-location-dot" style="color: var(--brand-red);"></i> ${data.lugar}
                                </div>
                            </div>
                            ${data.link ? `<a href="${data.link}" target="_blank" class="btn-event"><i class="fa-solid fa-ticket"></i> Más Información</a>` : ''}
                        </div>
                    `;
                });

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("Error al cargar eventos:", error);
                container.innerHTML = '<div class="empty-text" style="color: var(--brand-red);">Hubo un error al conectar con Firebase.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
